[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codara-mcp"
version = "0.5.0"
description = "Python MCP server exposing codebase retrieval through a coding-agent CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tien Ngo" }]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "numpy==2.5.4",
    "voyageai==0.6.0",
    "coding-agent-cli==0.2.2",
]

[project.scripts]
codara-mcp = "codara_mcp.launch:server"
codara = "codara_mcp.launch:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/codara_mcp"]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "pytest",
    "ruff",
    "ty",
]

[tool.coverage.run]
source = ["codara_mcp"]
branch = true
relative_files = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
src = ["src"]

[tool.ty.src]
include = ["src"]
