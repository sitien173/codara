<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codara data flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    .colophon {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--color-muted);
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(45,49,66,0.12);
    }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">codara-mcp</p>
    <h1>Codara data flow</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-flow-title data-flow-desc">
        <title id="data-flow-title">Codara data flow</title>
        <desc id="data-flow-desc">The write path indexes changed repository files under a lock, the read path ranks indexed chunks by cosine similarity, and the retrieval path runs a read-only agent over index hints.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- lanes, connectors, labels, then nodes -->
        <rect x="40" y="40" width="1200" height="200" fill="rgba(45,49,66,0.018)"/>
        <text x="104" y="136" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">WRITE PATH</text>
        <text x="104" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">index_update</text>
        <text x="104" y="336" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">READ PATH</text>
        <text x="104" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">semantic_search</text>
        <rect x="40" y="440" width="1200" height="200" fill="rgba(45,49,66,0.018)"/>
        <text x="104" y="536" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">RETRIEVAL</text>
        <text x="104" y="552" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">codebase_retrieval</text>
        <line x1="40" y1="240" x2="1240" y2="240" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="40" y1="440" x2="1240" y2="440" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <line x1="168" y1="40" x2="168" y2="640" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <path d="M556,140 L604,140" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M804,140 L852,140" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M556,340 L604,340" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="562.5" y="320" width="35" height="12" rx="2" fill="#f5f5f5"/><text x="580" y="329" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">QUERY</text>
        <path d="M804,340 L852,340" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M556,540 L604,540" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M804,540 L852,540" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="356" y="92" width="200" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="356" y="92" width="200" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="368" y="104" width="29" height="16" rx="2" fill="none" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
        <text x="382.5" y="115" fill="#2d3142" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
        <text x="368" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Select changed files</text>
        <text x="368" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">skip: same mtime_ns + size</text>
        <text x="368" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">else sha256, then chunk</text>
        <rect x="604" y="92" width="200" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="604" y="92" width="200" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
        <rect x="616" y="104" width="29" height="16" rx="2" fill="none" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
        <text x="630.5" y="115" fill="#2d3142" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="616" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Chunk and embed</text>
        <text x="616" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">30 lines, 15 overlap</text>
        <text x="616" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">reuse by hash, batch 128</text>
        <rect x="852" y="92" width="200" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="852" y="92" width="200" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="864" y="104" width="40" height="16" rx="2" fill="none" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
        <text x="884.0" y="115" fill="#2d3142" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="864" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Upsert index</text>
        <text x="864" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">files · chunks · embeddings</text>
        <text x="864" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">drop removed, bump gen</text>
        <rect x="356" y="292" width="200" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="356" y="292" width="200" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
        <rect x="368" y="304" width="29" height="16" rx="2" fill="none" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
        <text x="382.5" y="315" fill="#2d3142" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="368" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Embed query</text>
        <text x="368" y="362" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">voyage-code-3 · 1024 dims</text>
        <text x="368" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">normalized query vector</text>
        <rect x="604" y="292" width="200" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="604" y="292" width="200" height="96" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="616" y="304" width="46" height="16" rx="2" fill="none" stroke="rgba(191,69,32,0.4)" stroke-width="0.8"/>
        <text x="639.0" y="315" fill="#2d3142" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SERVER</text>
        <text x="616" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Cosine top-k</text>
        <text x="616" y="362" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">cached matrix @ query</text>
        <text x="616" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">path prefix · top_k 1-50</text>
        <rect x="852" y="292" width="200" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="852" y="292" width="200" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="864" y="304" width="46" height="16" rx="2" fill="none" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
        <text x="887.0" y="315" fill="#2d3142" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SERVER</text>
        <text x="864" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Stale check</text>
        <text x="864" y="362" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">mtime and size vs indexed</text>
        <text x="864" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">stale hit: empty text</text>
        <rect x="356" y="492" width="200" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="356" y="492" width="200" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="368" y="504" width="46" height="16" rx="2" fill="none" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
        <text x="391.0" y="515" fill="#2d3142" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SERVER</text>
        <text x="368" y="544" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Snapshot and hints</text>
        <text x="368" y="562" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">git status + file hashes</text>
        <text x="368" y="574" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">up to 5 hints, semantic_search</text>
        <rect x="604" y="492" width="200" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="604" y="492" width="200" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
        <rect x="616" y="504" width="40" height="16" rx="2" fill="none" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
        <text x="636.0" y="515" fill="#2d3142" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="616" y="544" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Agent CLI, read-only</text>
        <text x="616" y="562" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">CODARA_RETRIEVAL_ACTIVE=1</text>
        <text x="616" y="574" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">max 2 concurrent runs</text>
        <rect x="852" y="492" width="200" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="852" y="492" width="200" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="864" y="504" width="34" height="16" rx="2" fill="none" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
        <text x="881.0" y="515" fill="#2d3142" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">REPO</text>
        <text x="864" y="544" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Re-check git state</text>
        <text x="864" y="562" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">unchanged: return answer</text>
        <text x="864" y="574" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">changed: REPO_MODIFIED</text>
        <line x1="40" y1="664" x2="1240" y2="664" stroke="rgba(45,49,66,0.1)" stroke-width="0.8"/>
        <text x="40" y="692" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="684" width="24" height="14" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="152" y="694" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">FOCAL NODE</text>
        <rect x="264" y="684" width="24" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="296" y="694" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">BACKEND</text>

        <path d="M600,688 H640" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="648" y="694" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">FOCAL HANDOFF</text>

      </svg>
    </div>
    <p class="colophon">Both paths use one index, .codara/index-v2.sqlite. Unchanged files are skipped by mtime_ns and size unless the chunker version changed. The write path holds .codara/index.lock; the retrieval path re-checks git state before it answers.</p>
  </div>
</body>
</html>
