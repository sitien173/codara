<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">Codara architecture</title>
        <desc id="architecture-desc">The codara-mcp server exposes four tools to coding-agent clients, reads a local SQLite index that a separate CLI writes, and calls the Voyage AI embedding API and a read-only agent CLI.</desc>
        <defs>
      <style>#architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-root .colophon { font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--color-muted);
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(45,49,66,0.12); }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
