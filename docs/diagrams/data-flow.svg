<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-flow-title data-flow-desc" id="data-flow-root">
        <title id="data-flow-title">Codara data flow</title>
        <desc id="data-flow-desc">The write path indexes changed repository files under a lock, the read path ranks indexed chunks by cosine similarity, and the retrieval path runs a read-only agent over index hints.</desc>
        <defs>
      <style>#data-flow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #data-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #data-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #data-flow-root .colophon { font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--color-muted);
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(45,49,66,0.12); }
      @media print {
#data-flow-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="data-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="data-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="data-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
